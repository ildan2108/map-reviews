services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan serve --host=0.0.0.0 --port=8000
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan queue:work --tries=3 --timeout=120
    volumes:
      - .:/var/www/html
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:16
    environment:
      POSTGRES_DB: map_reviews
      POSTGRES_USER: map_reviews
      POSTGRES_PASSWORD: secret
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U map_reviews -d map_reviews"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - database_data:/var/lib/postgresql/data

volumes:
  database_data:
